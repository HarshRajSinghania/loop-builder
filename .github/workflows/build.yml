# Build Loop Builder for Mac and Windows. Tags like v0.1.0 also publish a GitHub Release.
# Signing is optional. Mac: runs when the MAC_*/APPLE_* secrets exist. Windows: runs when the release environment
# has the AZURE_* variables (Artifact Signing, signed in through GitHub's OIDC token: no stored secret).
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false  # never cancel a release half way through

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write  # lets the Windows build sign in to Azure for Artifact Signing
    environment: release  # holds the Windows signing settings; allowed for v* tags and main
    env:
      HAS_MAC_CERT: ${{ secrets.MAC_CERT_P12 != '' }}
      HAS_WIN_SIGN: ${{ vars.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="$(python packaging/version.py)"
          [ "v$VERSION" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$VERSION in packaging/version.py"; exit 1; }

      - name: Tests
        run: python -m pytest -q

      - name: Build the app (PyInstaller)
        run: pyinstaller packaging/loopbuilder.spec --noconfirm

      # ---- Mac ----
      - name: Import the signing certificate (Mac)
        if: runner.os == 'macOS' && env.HAS_MAC_CERT == 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "$MAC_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12

      - name: Make the .dmg (Mac)
        if: runner.os == 'macOS'
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: packaging/mac/make_dmg.sh dist out

      # ---- Windows ----
      - name: Get the WebView2 bootstrapper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile packaging/windows/MicrosoftEdgeWebview2Setup.exe

      - name: Sign in to Azure (Windows)
        if: runner.os == 'Windows' && env.HAS_WIN_SIGN == 'true'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6  # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the app (Windows)
        if: runner.os == 'Windows' && env.HAS_WIN_SIGN == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files: ${{ github.workspace }}\dist\Loop Builder\Loop Builder.exe
          description: Loop Builder
          description-url: https://github.com/mhuot/loop-builder

      - name: Make the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (python packaging/version.py).Trim()
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$version" "/DDistDir=$PWD\dist" "/DOutDir=$PWD\out" packaging\windows\loopbuilder.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign the installer (Windows)
        if: runner.os == 'Windows' && env.HAS_WIN_SIGN == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82  # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\out
          files-folder-filter: exe
          description: Loop Builder installer
          description-url: https://github.com/mhuot/loop-builder

      - name: Make the portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: packaging/windows/make_portable.ps1 -Dist dist -Out out

      - name: Check the signatures (Windows)
        if: runner.os == 'Windows' && env.HAS_WIN_SIGN == 'true'
        shell: pwsh
        run: |
          foreach ($f in @("dist\Loop Builder\Loop Builder.exe") + (Get-ChildItem out\*.exe).FullName) {
            $sig = Get-AuthenticodeSignature $f
            "{0}: {1} ({2})" -f (Split-Path $f -Leaf), $sig.Status, $sig.SignerCertificate.Subject
            if ($sig.Status -ne "Valid") { exit 1 }
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: loop-builder-${{ runner.os }}
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # creates the release and uploads its files
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: out/*
          generate_release_notes: true  # from the merged pull requests and commits since the last release
